[workspace]
members = ["demos/*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.98"

[package]
name = "esp3d"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[workspace.dependencies]
esp-hal = { version = "~1.2.0", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp32s3",
  "log-04",
] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
static_cell = "2.1.1"
embedded-graphics = "0.8.2"
embedded-graphics-framebuf = "0.5.0"
embedded-3dgfx = { version = "0.7.1", default-features = false, features = ["depth-u16", "row_width_320", "lighting"] }
nalgebra = { version = "0.35", default-features = false, features = [ "libm" ] }

[dependencies]
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-hal.workspace = true
esp-rtos.workspace = true

log                    = "0.4.34"

embassy-executor.workspace = true
embassy-time.workspace = true
esp-alloc = "0.11.0"
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }

critical-section = "1.2.0"
static_cell.workspace = true
embassy-sync = "0.8.0"
embedded-hal = "1.0.0"
embedded-hal-bus = { version = "0.3.0", features = ["alloc", "async"] }
sky-ili9341 = { version = "0.1.1", features = ["async", "embedded-hal-async"] }
embedded-graphics.workspace = true
embedded-graphics-framebuf.workspace = true

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
